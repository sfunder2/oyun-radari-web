name: PS Store probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe store.playstation.com
        run: |
          mkdir -p data
          python3 - <<'PY' > data/ps-probe.txt 2>&1
          import re,json,urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          urls=['https://store.playstation.com/tr-tr/product/EP4484-PPSA03711_00-3235764131417729','https://store.playstation.com/tr-tr/pages/deals','https://store.playstation.com/tr-tr/category/3f772501-f6f8-49b7-abac-874a88ca4897/1']
          for u in urls:
              print('===',u)
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Language':'tr-TR,tr;q=0.9'})
                  r=urllib.request.urlopen(req,timeout=30); s=r.read().decode('utf-8','replace'); print('http',r.status,'size',len(s))
              except Exception as e:
                  print('ERR',e); continue
              m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',s,re.S)
              if not m: print('no __NEXT_DATA__', s[:200].replace(chr(10),' ')); continue
              d=json.loads(m.group(1))
              ap=d.get('props',{}).get('apolloState',{})
              print('top',list(d.keys()),'props',list(d.get('props',{}).keys()),'apollo',len(ap))
              from collections import Counter
              print(Counter(k.split(':')[0] for k in ap))
              for k,v in ap.items():
                  t=json.dumps(v,ensure_ascii=False)
                  if re.search(r'"(price|basePrice|discountedPrice|discountText|upsellText|currencyCode)"',t) and len(t)<1500: print('PRICEKEY',k,t[:700])
              pk=[k for k in ap if k.startswith('Product:')][:2]
              for k in pk: print('PRODUCT',k,json.dumps(ap[k],ensure_ascii=False)[:900])
              print('ROOT_QUERY keys',[k[:120] for k in ap.get('ROOT_QUERY',{})][:15])
          PY
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/ps-probe.txt; git commit -qm 'PS probe result [skip ci]'; git push
