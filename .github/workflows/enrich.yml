name: Enrich games (other stores and scores)
on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
concurrency:
  group: enrich
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match other stores and fetch scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/enrich-run.mjs
