name: Neon schedules (prices, markets, enrich, genres, metacritic)
# Replaces the Supabase Cron jobs that called the refresh-* Edge Functions.
# On since the move to Neon (the Supabase Cron jobs stay as the old copy's rollback path).
# Needs the secrets SUPABASE_URL and SUPABASE_SERVICE_KEY. Manual runs always work.
on:
  schedule:
    # Veritabanı artık Mac mini üzerindeki Postgres + PostgREST; eski ücretsiz kota sınırları yok. GitHub cron alt sınırı 5 dakikadır.
    - cron: '*/5 * * * *'      # ps-prices
    - cron: '1-59/5 * * * *'   # markets
    - cron: '3-59/5 * * * *'   # enrich
    - cron: '7-59/10 * * * *'     # genres
    - cron: '43 */3 * * *'     # metacritic (kısa tur)
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run by hand'
        type: choice
        options: [ps-prices, markets, markets-loop, enrich, genres, metacritic]
        default: ps-prices
permissions:
  contents: read
env:
  # Toplayıcılar kendi PostgREST sunucusuna yazar (NEON_DATABASE_URL bilerek verilmiyor).
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
jobs:
  ps-prices:
    if: (github.event_name == 'workflow_dispatch' && inputs.job == 'ps-prices') || (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency: { group: neon-ps-prices, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/update-ps-catalog.mjs
  markets:
    if: (github.event_name == 'workflow_dispatch' && inputs.job == 'markets') || (github.event_name == 'schedule' && github.event.schedule == '1-59/5 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency: { group: neon-markets, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/market-run.mjs
  # GitHub's */5 cron can run late or not at all; this one run keeps working through the catalog on its own (about 20 batches finish a full Nintendo pass).
  markets-loop:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'markets-loop'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency: { group: neon-markets, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          for i in $(seq 1 25); do
            echo "::group::batch $i"; node scripts/market-run.mjs || true; echo "::endgroup::"
          done
  enrich:
    if: (github.event_name == 'workflow_dispatch' && inputs.job == 'enrich') || (github.event_name == 'schedule' && github.event.schedule == '3-59/5 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: neon-enrich, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/enrich-run.mjs
  genres:
    if: (github.event_name == 'workflow_dispatch' && inputs.job == 'genres') || (github.event_name == 'schedule' && github.event.schedule == '7-59/10 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: neon-genres, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/genres-run.mjs
  # Eksik Metacritic puanlarını doldurur (Wikidata + Wikipedia + Steam). 3 saatte bir 20 dakikalık tur; el ile çalıştırma 54 dakikalık toplu doldurmadır.
  metacritic:
    if: (github.event_name == 'workflow_dispatch' && inputs.job == 'metacritic') || (github.event_name == 'schedule' && github.event.schedule == '43 */3 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 58
    concurrency: { group: neon-metacritic, cancel-in-progress: false }
    env:
      METACRITIC_WIKIDATA: ${{ github.event_name == 'schedule' && '0' || '1' }}
      METACRITIC_MINUTES: ${{ github.event_name == 'schedule' && '20' || '54' }}
      METACRITIC_STEAM_LIMIT: ${{ github.event_name == 'schedule' && '500' || '2400' }}
      METACRITIC_WIKIPEDIA_LIMIT: ${{ github.event_name == 'schedule' && '600' || '6000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/metacritic-run.mjs
