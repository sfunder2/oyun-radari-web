name: GitHub Pages Smoke Check
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/check-publish.mjs'
      - 'scripts/compare-game-offers.mjs'
      - 'scripts/price-card-model.mjs'
      - 'tests/check-publish.test.mjs'
      - 'tests/compare-game-offers.test.mjs'
      - 'tests/price-card-model.test.mjs'
      - '.github/workflows/pages-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/check-publish.mjs'
      - 'scripts/compare-game-offers.mjs'
      - 'scripts/price-card-model.mjs'
      - 'tests/check-publish.test.mjs'
      - 'tests/compare-game-offers.test.mjs'
      - 'tests/price-card-model.test.mjs'
      - '.github/workflows/pages-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test catalog publishing checks
        run: node --test tests/check-publish.test.mjs tests/compare-game-offers.test.mjs tests/price-card-model.test.mjs
  smoke:
    if: github.event_name != 'pull_request'
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public site HTML and assets
        run: node scripts/check-publish.mjs
