name: Supabase probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p data
          cat > /tmp/p.py <<'PYEOF'
          import os,json,urllib.request
          URL="https://dsosckshigzijnsxmlwh.supabase.co";PUB="sb_publishable_SjkjwIlJ_HFqd5hWhILF5g_6QJThaNO"
          def rq(path,key,method="GET",body=None,extra=None):
              h={"apikey":key,"Authorization":"Bearer "+key,"Content-Type":"application/json"};h.update(extra or {})
              try:
                  r=urllib.request.urlopen(urllib.request.Request(URL+path,data=body,method=method,headers=h),timeout=30);return r.status,r.read().decode()[:160]
              except urllib.error.HTTPError as e:return e.code,e.read().decode()[:160]
              except Exception as e:return "ERR",str(e)[:120]
          for t in ("ps_products","ps_price_history","ps_state"):print("okuma",t,rq("/rest/v1/"+t+"?select=*&limit=1",PUB))
          sk=os.environ.get("SUPABASE_SERVICE_KEY","");su=os.environ.get("SUPABASE_URL","")
          print("secret SUPABASE_SERVICE_KEY var:",bool(sk),"| SUPABASE_URL var:",bool(su),"| URL eşleşiyor:",su.rstrip("/")==URL)
          if sk:
              print("service anahtarı okuma:",rq("/rest/v1/ps_state?select=key&limit=1",sk))
              print("service anahtarı yazma:",rq("/rest/v1/ps_state?on_conflict=key",sk,"POST",json.dumps({"key":"probe","value":{"ok":True}}).encode(),{"Prefer":"resolution=merge-duplicates,return=minimal"}))
              print("anon yazma engelli mi:",rq("/rest/v1/ps_state?on_conflict=key",PUB,"POST",json.dumps({"key":"probe2","value":{}}).encode(),{"Prefer":"return=minimal"}))
          PYEOF
          python3 /tmp/p.py > data/sb-probe.txt 2>&1 || true
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/sb-probe.txt; git commit -qm 'Supabase probe [skip ci]'; git pull --rebase -q origin main; git push
