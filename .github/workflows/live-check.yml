name: live check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p data /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 --no-audit --no-fund >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cd $GITHUB_WORKSPACE
          cat > live.mjs <<'JSEOF'
          import {chromium} from 'playwright';import {writeFileSync} from 'node:fs';
          const out={};const b=await chromium.launch();
          for(const [w,h] of [[1280,900],[390,844]]){
           const ctx=await b.newContext({viewport:{width:w,height:h},colorScheme:'dark'});const pg=await ctx.newPage();
           const bad=[],ok={n:0},cons=[];
           pg.on('response',r=>{if(r.request().resourceType()==='image'){if(r.status()>=400)bad.push(r.status()+' '+r.url().slice(0,110));else ok.n++}});
           pg.on('requestfailed',r=>{if(r.resourceType()==='image')bad.push('FAIL '+(r.failure()?.errorText||'')+' '+r.url().slice(0,110))});
           pg.on('console',m=>{if(m.type()==='error')cons.push(m.text().slice(0,140))});pg.on('pageerror',e=>cons.push('PAGEERR '+String(e).slice(0,140)));
           await pg.goto('https://sfunder2.github.io/oyun-radari-web/?section=all',{waitUntil:'networkidle',timeout:60000}).catch(e=>cons.push('goto '+e.message.slice(0,80)));
           await pg.waitForTimeout(2500);
           const sk=pg.getByText('Sonra seçerim, keşfe geç');if(await sk.count()){await sk.click();await pg.waitForTimeout(600)}
           await pg.waitForTimeout(3500);
           const stat=async()=>pg.evaluate(()=>{const imgs=[...document.querySelectorAll('img')];const vis=imgs.filter(i=>{const r=i.getBoundingClientRect();return r.width>0&&r.height>0});
            return{total:imgs.length,visible:vis.length,loaded:vis.filter(i=>i.complete&&i.naturalWidth>0).length,hiddenByError:imgs.filter(i=>i.style.visibility==='hidden').length,
             broken:vis.filter(i=>i.complete&&i.naturalWidth===0).slice(0,4).map(i=>i.currentSrc.slice(0,100)),cards:document.querySelectorAll('.catalogcard').length,
             artSizes:[...document.querySelectorAll('.catalogcard .art')].slice(0,3).map(a=>Math.round(a.getBoundingClientRect().width)+'x'+Math.round(a.getBoundingClientRect().height)),
             cardImg:[...document.querySelectorAll('.catalogcard .art img')].slice(0,3).map(i=>({w:i.naturalWidth,h:i.getBoundingClientRect().height|0,vis:getComputedStyle(i).visibility,op:getComputedStyle(i).opacity,disp:getComputedStyle(i).display}))}});
           out['top_'+w]=await stat();await pg.screenshot({path:`data/live-${w}-top.png`});
           await pg.evaluate(()=>window.scrollTo(0,1100));await pg.waitForTimeout(2500);out['scrolled_'+w]=await stat();await pg.screenshot({path:`data/live-${w}-cards.png`});
           out['bad_'+w]=bad.slice(0,12);out['okImages_'+w]=ok.n;out['console_'+w]=[...new Set(cons)].slice(0,6);await ctx.close();
          }
          await b.close();writeFileSync('data/live.json',JSON.stringify(out,null,1));
          JSEOF
          cp live.mjs /tmp/pw/live.mjs && cd /tmp/pw && ln -sfn $GITHUB_WORKSPACE/data data && node live.mjs > /tmp/o.txt 2>&1 || cp /tmp/o.txt $GITHUB_WORKSPACE/data/live-error.txt
          cd $GITHUB_WORKSPACE && rm -f live.mjs
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/live*; git commit -qm 'live check [skip ci]'; git pull --rebase -q origin main; git push
