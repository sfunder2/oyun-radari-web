name: Sprint 01 Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run repository tests
        run: node --test tests/*.test.mjs
      - name: Dependency audit
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts && npm audit --audit-level=high; else echo 'No lockfile; dependency audit requires lockfile'; fi
      - name: Check syntax
        run: |
          for file in scripts/*.mjs tests/*.test.mjs; do node --check "$file"; done
