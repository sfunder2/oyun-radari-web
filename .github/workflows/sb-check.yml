name: Supabase check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          cat > /tmp/p.py <<'PYEOF'
          import json,urllib.request
          URL="https://dsosckshigzijnsxmlwh.supabase.co";PUB="sb_publishable_SjkjwIlJ_HFqd5hWhILF5g_6QJThaNO"
          def rq(path,extra=None):
              h={"apikey":PUB,"Authorization":"Bearer "+PUB};h.update(extra or {})
              try:
                  r=urllib.request.urlopen(urllib.request.Request(URL+"/rest/v1/"+path,headers=h),timeout=30);return r.headers,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:return None,"HTTP %s %s"%(e.code,e.read().decode()[:120])
          for t in ("ps_products","store_offers","game_scores","oc_index"):
              h,_=rq(t+"?select=*&limit=1",{"Prefer":"count=exact"});print("sayi",t,h.get("content-range") if h else _)
          _,s=rq("ps_state?select=key,value&key=in.(oc_index,batch)");print("durum",json.dumps(s,ensure_ascii=False)[:300])
          h,r=rq("ps_products?select=id&enriched_at=not.is.null&limit=1",{"Prefer":"count=exact"});print("zenginlestirilen",h.get("content-range") if h else r)
          _,p=rq("library?select=name,price,offers,scores&offers=neq.[]&order=discount_percent.desc&limit=4");print("ornek",json.dumps(p,ensure_ascii=False)[:1400])
          h,r=rq("library?select=name&scores=not.is.null&limit=1",{"Prefer":"count=exact"});print("puanli oyun",h.get("content-range") if h else r)
          PYEOF
          python3 /tmp/p.py > data/sb-check2.txt 2>&1 || true
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/sb-check2.txt; git commit -qm 'check [skip ci]'; git pull --rebase -q origin main; git push
