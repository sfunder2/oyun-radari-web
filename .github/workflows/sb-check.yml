name: Supabase check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          cat > /tmp/p.py <<'PYEOF'
          import json,urllib.request
          URL="https://dsosckshigzijnsxmlwh.supabase.co";PUB="sb_publishable_SjkjwIlJ_HFqd5hWhILF5g_6QJThaNO"
          def rq(path,extra=None):
              h={"apikey":PUB,"Authorization":"Bearer "+PUB};h.update(extra or {})
              try:
                  r=urllib.request.urlopen(urllib.request.Request(URL+"/rest/v1/"+path,headers=h),timeout=30);return r.headers,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:return None,"HTTP %s %s"%(e.code,e.read().decode()[:140])
          C={"Prefer":"count=exact"}
          for label,path in (("news_items","news_items?select=url&limit=1"),("game_meta","game_meta?select=title_key&limit=1"),("meta gereksinimli","game_meta?select=title_key&requirements=not.is.null&limit=1"),("meta duyurulu","game_meta?select=title_key&news=not.is.null&limit=1"),("meta DLC>0","game_meta?select=title_key&dlc_count=gt.0&limit=1"),("library gereksinimli","library?select=id&requirements=not.is.null&limit=1"),("library","library?select=id&limit=1"),("ps_products","ps_products?select=id&limit=1")):
              h,r=rq(path,C);print("sayi",label,h.get("content-range") if h else r)
          h,r=rq("news_items?select=source,title&order=published_at.desc&limit=3");print("haber",json.dumps(r,ensure_ascii=False)[:420])
          h,r=rq("library?select=name,steam_appid,dlc_count,requirements&requirements=not.is.null&limit=1");print("ornek",json.dumps(r,ensure_ascii=False)[:520])
          h,r=rq("ps_state?select=key,value&key=in.(news,upcoming)");print("durum",json.dumps(r,ensure_ascii=False)[:260])
          PYEOF
          python3 /tmp/p.py > data/sb-check8.txt 2>&1 || true
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/sb-check8.txt; git commit -qm 'check [skip ci]'; git pull --rebase -q origin main; git push
