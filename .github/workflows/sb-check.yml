name: Supabase check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          cat > /tmp/p.py <<'PYEOF'
          import json,urllib.request,urllib.parse,re,random
          URL="https://dsosckshigzijnsxmlwh.supabase.co";PUB="sb_publishable_SjkjwIlJ_HFqd5hWhILF5g_6QJThaNO"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def rq(path):
              r=urllib.request.urlopen(urllib.request.Request(URL+"/rest/v1/"+path,headers={"apikey":PUB,"Authorization":"Bearer "+PUB}),timeout=30);return json.loads(r.read().decode())
          def hit(u,ref=None):
              h={"User-Agent":UA,"Accept":"image/avif,image/webp,image/*,*/*;q=0.8"}
              if ref:h["Referer"]=ref
              if u.startswith("//"):u="https:"+u
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=25);b=r.read();return r.status,len(b),r.headers.get("content-type","")[:20]
              except urllib.error.HTTPError as e:return e.code,0,""
              except Exception as e:return "ERR",0,str(e)[:40]
          REF="https://sfunder2.github.io/oyun-radari-web/"
          sets={"PS kapak":[x["image"] for x in rq("ps_products?select=image&image=not.is.null&limit=6&order=checked_at.desc")],
           "PS hero":[x["hero_url"]+"?w=1600" for x in rq("ps_products?select=hero_url&hero_url=not.is.null&limit=3")],
           "Steam":[x["image"] for x in rq("store_offers?select=image&platform=eq.steam&image=not.is.null&limit=5")],
           "Xbox":[x["image"] for x in rq("store_offers?select=image&platform=eq.xbox&image=not.is.null&limit=5")],
           "Switch":[x["image"] for x in rq("store_offers?select=image&platform=eq.switch&image=not.is.null&limit=5")]}
          for k,v in sets.items():
              res=[]
              for u in v[:5]:
                  a=hit(u);b=hit(u,REF);res.append((a[0],b[0],a[1]//1024))
              print("GORSEL",k,"| (referanssız, referanslı, KB):",res);print("   örnek:",v[0][:120] if v else "-")
          n=0
          for tb,col in (("ps_products","image"),("store_offers","image")):
              r=rq(tb+"?select="+col+"&"+col+"=not.like.https://*&limit=3");print("GORSEL https olmayan",tb,len(r),[x[col][:50] for x in r])
          r=urllib.request.urlopen(urllib.request.Request(REF,headers={"User-Agent":UA}),timeout=30);html=r.read().decode();print("GORSEL site",r.status,len(html),re.findall(r"assets/[^"']+",html)[:4])
          for a in re.findall(r"assets/[^"']+",html)[:3]:
              print("GORSEL varlık",a,hit(REF+a)[:2])
          PYEOF
          python3 /tmp/p.py > data/img-probe.txt 2>&1 || true
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/img-probe.txt; git commit -qm 'check [skip ci]'; git pull --rebase -q origin main; git push
