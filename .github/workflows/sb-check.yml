name: Supabase check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          cat > /tmp/p.py <<'PYEOF'
          import json,urllib.request
          URL="https://dsosckshigzijnsxmlwh.supabase.co";PUB="sb_publishable_SjkjwIlJ_HFqd5hWhILF5g_6QJThaNO"
          def req(path,method="GET",body=None,extra=None):
              h={"apikey":PUB,"Authorization":"Bearer "+PUB,"Content-Type":"application/json"};h.update(extra or {})
              try:
                  r=urllib.request.urlopen(urllib.request.Request(URL+path,data=json.dumps(body).encode() if body is not None else None,method=method,headers=h),timeout=30);return r.status,r.read().decode()[:200]
              except urllib.error.HTTPError as e:return e.code,e.read().decode()[:160]
          tables=["collector_leases", "game_meta", "game_scores", "library", "news_items", "oc_index", "ps_price_history", "ps_products", "ps_state", "radar_follows", "radar_lists", "radar_posts", "radar_profiles", "radar_tags", "radar_votes", "store_offers", "upcoming_games"]
          rpcs=["claim_ps_batch", "release_ps_batch", "search_games"]
          for tb in sorted(tables):
              s,r=req("/rest/v1/"+tb+"?select=*&limit=1");rd=("OKU "+str(s))
              sw,rw=req("/rest/v1/"+tb,"POST",{},{"Prefer":"return=minimal"})
              sd,rd2=req("/rest/v1/"+tb+"?id=eq.00000000-0000-0000-0000-000000000000","DELETE",None,{"Prefer":"return=minimal"});sp,rp=req("/rest/v1/"+tb+"?select=*&limit=1","PATCH",{"x":1},{"Prefer":"return=minimal"})
              print("AUDIT",tb.ljust(20),"oku:",s,"| ekle:",sw,rw[:60].replace(chr(10)," "),"| sil:",sd,"| güncelle:",sp,rp[:50].replace(chr(10)," "),"| sütunlar:",(list(json.loads(r)[0].keys())[:7] if s==200 and r.startswith("[{") else "-"))
          for fn in ("claim_ps_batch","release_ps_batch"):
              s,r=req("/rest/v1/rpc/"+fn,"POST",{"lease_token":"00000000-0000-0000-0000-000000000000"});print("AUDIT rpc",fn.ljust(16),"anon çağrı:",s,r[:90].replace(chr(10)," "))
          s,r=req("/rest/v1/rpc/search_games","POST",{"query_text":"zzzz"});print("AUDIT rpc search_games   anon çağrı:",s,r[:60])
          PYEOF
          python3 /tmp/p.py > data/sb-audit2.txt 2>&1 || true
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/sb-audit2.txt; git commit -qm 'check [skip ci]'; git pull --rebase -q origin main; git push
