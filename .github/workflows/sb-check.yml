name: Supabase check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          cat > /tmp/p.py <<'PYEOF'
          import json,urllib.request,re
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA,"Accept":"*/*"}),timeout=25);return r.status,r.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e:return e.code,""
              except Exception as e:return "ERR",str(e)[:80]
          s,t=get("https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?appid=1145360&count=2&maxlength=240");print("STEAMNEWS",s,t[:350].replace(chr(10)," "))
          s,t=get("https://store.steampowered.com/api/appdetails?appids=1145360&cc=tr&l=english");d=json.loads(t)["1145360"]["data"]
          print("REQ",json.dumps(d.get("pc_requirements"))[:700]);print("DLC",d.get("dlc"))
          for name,u in (("IGN","https://feeds.ign.com/ign/games-all"),("GameSpot","https://www.gamespot.com/feeds/news/"),("Eurogamer","https://www.eurogamer.net/feed"),("PCGamer","https://www.pcgamer.com/rss/"),("RPS","https://www.rockpapershotgun.com/feed"),("Polygon","https://www.polygon.com/rss/index.xml")):
              s,t=get(u);items=re.findall(r"<item>(.*?)</item>",t,re.S) if s==200 else []
              first=re.search(r"<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>",items[0],re.S) if items else None
              print("RSS",name,s,len(items),first.group(1).strip()[:80] if first else None)
          PYEOF
          python3 /tmp/p.py > data/sb-check7.txt 2>&1 || true
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/sb-check7.txt; git commit -qm 'check [skip ci]'; git pull --rebase -q origin main; git push
