name: Supabase check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          cat > /tmp/p.py <<'PYEOF'
          import json,urllib.request,re
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for pid in ("EP4062-PPSA03797_00-OUTWARDDEFEU0000","EP4062-CUSA10853_00-OTWADVBUNDLEEU00"):
              s=urllib.request.urlopen(urllib.request.Request("https://store.playstation.com/tr-tr/product/"+pid,headers={"User-Agent":UA,"Accept-Language":"tr-TR,tr;q=0.9"}),timeout=30).read().decode("utf-8","replace")
              print("ID",pid,len(s))
              print("final",re.findall(r'finalPrice"[^>]*>([^<]+)<',s)[:3],"orig",re.findall(r'originalPrice"[^>]*>([^<]+)<',s)[:3],"ld",re.findall(r'"offers":\{[^}]*\}',s)[:1])
              prices=re.findall(r'"price":(\{"__typename":"Price"[^{}]*\})',s)
              for p in prices[:4]: print("PRICE",p[:520])
          PYEOF
          python3 /tmp/p.py > data/sb-check4.txt 2>&1 || true
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/sb-check4.txt; git commit -qm 'check [skip ci]'; git pull --rebase -q origin main; git push
