name: Supabase check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          cat > /tmp/p.py <<'PYEOF'
          import json,urllib.request,urllib.parse,time
          URL="https://dsosckshigzijnsxmlwh.supabase.co";PUB="sb_publishable_SjkjwIlJ_HFqd5hWhILF5g_6QJThaNO"
          H={"apikey":PUB,"Authorization":"Bearer "+PUB,"Content-Type":"application/json","Prefer":"count=exact"}
          def get(path):
              t=time.time()
              try:
                  r=urllib.request.urlopen(urllib.request.Request(URL+"/rest/v1/"+path,headers=H),timeout=40);b=json.loads(r.read().decode());return r.status,round(time.time()-t,2),len(b),(r.headers.get("content-range") or "")
              except urllib.error.HTTPError as e:return e.code,round(time.time()-t,2),e.read().decode()[:110]
          def post(fn,body):
              t=time.time()
              try:
                  r=urllib.request.urlopen(urllib.request.Request(URL+"/rest/v1/rpc/"+fn,data=json.dumps(body).encode(),method="POST",headers=H),timeout=40);b=json.loads(r.read().decode());return r.status,round(time.time()-t,2),len(b.get("items",[])),b.get("total")
              except urllib.error.HTTPError as e:return e.code,round(time.time()-t,2),e.read().decode()[:110]
          r=urllib.request.urlopen(urllib.request.Request(URL+"/rest/v1/library?select=*&limit=1",headers=H),timeout=30);cols=sorted(json.loads(r.read().decode())[0].keys());print("GORSEL library sütunları:",len(cols),[c for c in cols if c in("hero_url","accent_color","preview_url","best_score","genres","release_date","offers","scores","turkish","age","steam_appid","requirements","tags","categories","enriched_at","title_key","store_status","developers")])
          Q=[("benzer (genres ov)","library?select=*&limit=40&order=best_score.desc.nullslast,name.asc&genres=ov.{Aksiyon,RPG}&id=neq.x"),
           ("seri (name_search+release_date)","library?select=*&limit=60&order=release_date.asc.nullslast,name.asc&name_search=ilike.*assassin*"),
           ("öneri","library?select=*&limit=40&order=best_score.desc.nullslast,name.asc&genres=ov.{Aksiyon}"),
           ("rastgele sayım","library?select=id&limit=1&best_score=gte.75"),
           ("rastgele sayfa","library?select=*&limit=1&order=id.asc&offset=40&best_score=gte.75"),
           ("hero adım 1 (puanlı)","library?select=*&best_score=gte.75&discount_percent=gt.0&order=discount_percent.desc,best_score.desc.nullslast&limit=30"),
           ("hero adım 2 (ps_products)","ps_products?select=id,hero_url,accent_color&hero_url=not.is.null&limit=5"),
           ("hero yedek","ps_products?select=id&hero_url=not.is.null&discount_percent=gt.0&order=discount_percent.desc&limit=20"),
           ("takvim","upcoming_games?select=*&limit=12&order=release_date.asc.nullslast,name.asc&release_date=gte.2026-10-23"),
           ("haber","news_items?select=url,source,title,published_at&order=published_at.desc&limit=24"),
           ("geçmiş","ps_price_history?select=day,price,base_price&order=day.asc&limit=400&product_id=eq.EP1"),
           ("durum","ps_state?select=value&key=eq.batch")]
          for n,q in Q:print("GORSEL",n.ljust(30),get(q))
          for n,b in (("search_games",{"query_text":"hades","page_number":0,"page_size":25,"deals_only":False,"sort_order":"default","filter_options":{}}),("search_market all",{"market":"all","query_text":"","page_number":0,"page_size":25,"deals_only":False,"sort_order":"default","filter_options":{"usdTry":40}}),("search_market steam deals",{"market":"steam","query_text":"","page_number":0,"page_size":25,"deals_only":True,"sort_order":"discount","filter_options":{}}),("search_market xbox arama",{"market":"xbox","query_text":"borderlands","page_number":0,"page_size":25,"deals_only":False,"sort_order":"default","filter_options":{}})):
              print("GORSEL",("rpc "+n).ljust(30),post(n.split(" ")[0],b))
          PYEOF
          python3 /tmp/p.py > data/queries.txt 2>&1 || true
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/queries.txt; git commit -qm 'check [skip ci]'; git pull --rebase -q origin main; git push
