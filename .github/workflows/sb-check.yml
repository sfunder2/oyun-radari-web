name: Supabase check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          cat > /tmp/p.py <<'PYEOF'
          import json,urllib.request
          URL="https://dsosckshigzijnsxmlwh.supabase.co";PUB="sb_publishable_SjkjwIlJ_HFqd5hWhILF5g_6QJThaNO"
          def rq(path,extra=None):
              h={"apikey":PUB,"Authorization":"Bearer "+PUB};h.update(extra or {})
              r=urllib.request.urlopen(urllib.request.Request(URL+"/rest/v1/"+path,headers=h),timeout=30);return r.headers,json.loads(r.read().decode())
          h,_=rq("ps_products?select=id&limit=1",{"Prefer":"count=exact"});print("ürün sayısı:",h.get("content-range"))
          h,_=rq("ps_price_history?select=day&limit=1",{"Prefer":"count=exact"});print("geçmiş satırı:",h.get("content-range"))
          h,_=rq("ps_products?select=id&discount_percent=gt.0&limit=1",{"Prefer":"count=exact"});print("indirimli:",h.get("content-range"))
          _,s=rq("ps_state?select=key,value");print("durum:",json.dumps(s,ensure_ascii=False)[:900])
          _,p=rq("ps_products?select=id,name,name_search,price,original_price,discount_percent,history_days,lowest_ever&order=discount_percent.desc&limit=3");print("örnek:",json.dumps(p,ensure_ascii=False))
          _,p=rq("ps_products?select=name,price&name_search=ilike.*hades*&limit=3");print("arama hades:",json.dumps(p,ensure_ascii=False))
          PYEOF
          python3 /tmp/p.py > data/sb-check.txt 2>&1 || true
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/sb-check.txt; git commit -qm 'check [skip ci]'; git pull --rebase -q origin main; git push
