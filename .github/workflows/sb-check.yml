name: Supabase check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          cat > /tmp/p.py <<'PYEOF'
          import json,urllib.request
          URL="https://dsosckshigzijnsxmlwh.supabase.co";PUB="sb_publishable_SjkjwIlJ_HFqd5hWhILF5g_6QJThaNO"
          def rq(path,extra=None):
              h={"apikey":PUB,"Authorization":"Bearer "+PUB};h.update(extra or {})
              try:
                  r=urllib.request.urlopen(urllib.request.Request(URL+"/rest/v1/"+path,headers=h),timeout=30);return r.headers,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:return None,"HTTP %s %s"%(e.code,e.read().decode()[:160])
          C={"Prefer":"count=exact"}
          for label,path in (("ps_products","ps_products?select=id&limit=1"),("preview_url dolu","ps_products?select=id&preview_url=not.is.null&limit=1"),("game_meta","game_meta?select=title_key&limit=1"),("upcoming_games","upcoming_games?select=id&limit=1"),("tarihli takvim","upcoming_games?select=id&release_date=not.is.null&limit=1"),("library","library?select=id&limit=1"),("library tur dolu","library?select=id&genres=not.eq.%7B%7D&limit=1"),("library puanli","library?select=id&best_score=not.is.null&limit=1"),("store_offers","store_offers?select=platform&limit=1"),("game_scores","game_scores?select=title_key&limit=1")):
              h,r=rq(path,C);print("sayi",label,h.get("content-range") if h else r)
          h,r=rq("library?select=name,genres,release_date,turkish,age,best_score&genres=not.eq.%7B%7D&order=best_score.desc.nullslast&limit=3");print("ornek",json.dumps(r,ensure_ascii=False)[:700])
          h,r=rq("upcoming_games?select=name,release_text,release_date&order=release_date.asc.nullslast&limit=3");print("takvim",json.dumps(r,ensure_ascii=False)[:500])
          h,r=rq("ps_state?select=key,value&key=in.(upcoming,oc_index)");print("durum",json.dumps(r,ensure_ascii=False)[:300])
          PYEOF
          python3 /tmp/p.py > data/sb-check6.txt 2>&1 || true
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/sb-check6.txt; git commit -qm 'check [skip ci]'; git pull --rebase -q origin main; git push
