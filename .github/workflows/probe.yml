name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          cat > /tmp/p.py <<'PYEOF'
          import json,urllib.request,urllib.parse
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(u,h=None,data=None,method=None):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,data=data,method=method,headers={"User-Agent":UA,**(h or {})}),timeout=25);return r.status,r.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e:return e.code,e.read().decode("utf-8","replace")[:200]
              except Exception as e:return "ERR",str(e)[:150]
          s,t=get("https://store.steampowered.com/api/storesearch/?term="+urllib.parse.quote("Hades")+"&cc=tr&l=turkish")
          print("STEAM storesearch",s,t[:700])
          s,t=get("https://store.steampowered.com/api/appdetails?appids=1145360&cc=tr&l=turkish&filters=basic,price_overview,metacritic")
          print("STEAM appdetails",s,t[:400])
          b=json.dumps({"ReturnFilters":False,"ChannelKeyToBeUsedInResponse":"SEARCH_CHANNELID=GAMES","Filters":"","ChannelId":"Games","Query":"Hades"}).encode()
          s,t=get("https://emerald.xboxservices.com/xboxcomfd/search/games?locale=tr-TR",{"Content-Type":"application/json","X-MS-API-Version":"1.1","MS-CV":"OyunRadariCatalog000000.0"},b,"POST")
          print("XBOX search",s,len(t),t[:200])
          q=urllib.parse.urlencode({"x-algolia-application-id":"U3B6GR4UA3","x-algolia-api-key":"a29c6927638bfd8cee23993e51e721c9","hitsPerPage":"3","page":"0","query":"Hades","filters":'platform:"Nintendo Switch"'})
          s,t=get("https://u3b6gr4ua3-dsn.algolia.net/1/indexes/store_game_en_us?"+q); print("NINTENDO",s,t[:300])
          for u in ("https://api.opencritic.com/api/game/search?criteria=hades","https://api.opencritic.com/api/game/10181","https://opencritic.com/game/10181/hades","https://opencritic.com/search?q=hades"):
              s,t=get(u,{"Accept":"application/json, text/html"}); print("OPENCRITIC",u,s,t[:300].replace(chr(10)," "))
          s,t=get("https://www.metacritic.com/game/hades/"); print("METACRITIC",s,len(t),t[:120].replace(chr(10)," "))
          PYEOF
          python3 /tmp/p.py > data/probe5.txt 2>&1 || true
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add data/probe5.txt; git commit -qm 'probe [skip ci]'; git pull --rebase -q origin main; git push
