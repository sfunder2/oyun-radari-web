name: Game ratings (IGDB)
on:
  # Dakikalar Supabase Cron işlerinin (markets :x1/:x6, admin :x2/:x7, enrich :x3/:x8, */3 arama görünümü, genres :07/:37) boş kaldığı dakikalara ve birbirinden ayrı saatlere yerleştirildi.
  schedule:
    - cron: '50 15 * * *'
  workflow_dispatch:
concurrency:
  group: igdb-score
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Fetch ratings from IGDB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/igdb-score-run.mjs
