name: Update PlayStation prices
on:
  # Automatic schedule runs in Supabase Cron. This workflow is the manual fallback.
  workflow_dispatch:
  push:
    paths: ['scripts/**', '.github/workflows/update-ps-prices.yml']
permissions:
  contents: read
concurrency:
  group: playstation-prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read PlayStation Store TR and write to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/update-ps-catalog.mjs
