name: Update PlayStation prices
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths: ['ps-links.json', 'scripts/update-ps-catalog.mjs', 'scripts/batch-state.mjs', '.github/workflows/update-ps-prices.yml']
permissions:
  contents: write
concurrency:
  group: playstation-prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh prices and discover games
        run: node scripts/update-ps-catalog.mjs
      - name: Batch report
        if: always()
        run: cat data/ps-batch-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save price index
        if: always()
        run: |
          git config user.name 'price-bot'
          git config user.email 'price-bot@users.noreply.github.com'
          git add data/ps-index.json data/ps-history.json
          git diff --staged --quiet || (git commit -m 'Refresh PS prices and discover games [skip ci]' && (git push || (git pull --rebase -X theirs origin main && git push)))
