name: Update PlayStation prices
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths: ['ps-links.json']
permissions:
  contents: write
concurrency:
  group: playstation-prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-ps-catalog.mjs
      - name: Save price index
        run: |
          git config user.name 'price-bot'
          git config user.email 'price-bot@users.noreply.github.com'
          git add data/ps-index.json data/ps-prices.json
          git diff --staged --quiet || (git commit -m 'Update PlayStation price index' && git push)
