name: Publish Oyun Radari
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Write runtime config
        env:
          RADAR_SENTRY_DSN: ${{ vars.RADAR_SENTRY_DSN }}
          RADAR_SENTRY_ENV: ${{ vars.RADAR_SENTRY_ENV }}
          RADAR_ANALYTICS_ENDPOINT: ${{ vars.RADAR_ANALYTICS_ENDPOINT }}
          RADAR_GOOGLE_LOGIN: ${{ vars.RADAR_GOOGLE_LOGIN }}
          RADAR_APPLE_LOGIN: ${{ vars.RADAR_APPLE_LOGIN }}
          RADAR_MAGIC_LINK: ${{ vars.RADAR_MAGIC_LINK }}
        run: node scripts/write-config.mjs
      # Deploy-time only (committed files stay unchanged): merge override CSS, defer non-critical modules, add the app skeleton.
      - run: node scripts/build-perf.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
