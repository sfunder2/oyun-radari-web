plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.sfunder2.oyunradari'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.sfunder2.oyunradari'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // Sabit anahtar: her derleme aynı imzayla çıkar, yeni APK eskisinin üzerine kurulur.
    // Yalnızca elden kurulum (sideload) içindir; Play Store'a yüklenecekse gizli bir anahtar kullanılmalı.
    signingConfigs {
        sideload {
            storeFile file('oyunradari-sideload.keystore')
            storePassword 'oyunradari'
            keyAlias 'oyunradari'
            keyPassword 'oyunradari'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
